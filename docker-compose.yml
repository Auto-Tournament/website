services:
  website:
    build:
      context: .
      args:
        # Set by scripts/auto_update.sh at deploy time.
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-dev}
    container_name: autotournament-website
    # Server-side secrets (STRIPE_SECRET_KEY, SITE_URL)
    # live in .env next to this file, read at runtime and never baked into the
    # image. Optional: without it card checkout is off and the calculator
    # falls back to the email request. Needs Docker Compose 2.24 or newer.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    ports:
      # The astro Cloudflare tunnel routes autotournament.gg to dev.lan:31236.
      # Its connectors run on several LAN hosts, so bind on all interfaces.
      - "0.0.0.0:31236:3000"
